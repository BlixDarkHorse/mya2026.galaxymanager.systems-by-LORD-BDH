<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Civil - M&A (Ruta GPS)</title>
    <style>
        /* Reseteo y fondo oscuro para resaltar la invitación */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal anclado */
        .invitation-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            display: block;
        }

        /* Imagen de invitación actuando como fondo responsivo */
        .bg-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenedor del QR superpuesto al fondo */
        .qr-wrapper {
            position: absolute;
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%);
            width: 110px; 
            height: 110px;
            padding: 8px;
            background: #fffdf7; 
            border: 2px solid #c99a42; 
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(90, 15, 27, 0.4);
            transition: transform 0.3s ease;
        }

        /* Efecto táctil para simular interactividad */
        .qr-wrapper:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* Imagen del QR renderizado en tiempo real */
        .qr-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 4px;
        }

        /* Adaptación para pantallas móviles pequeñas */
        @media (max-width: 480px) {
            .qr-wrapper {
                bottom: 25px;
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="invitation-wrapper">
        <!-- BASE: IMAGEN DE INVITACIÓN -->
        <img src="INVI CIVIL.jpeg" alt="Invitación Civil" class="bg-image">
        
        <!-- SUPERPOSICIÓN: QR DINÁMICO HACIA GOOGLE MAPS -->
        <a class="qr-wrapper" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=Calle+del+Encanto%2C+Zoyatepec%2C+Guerrero%2C+Mexico&travelmode=driving&dir_action=navigate">
            <!-- La URL del mapa se codifica dentro del parámetro 'text' de la API -->
            <img src="https://quickchart.io/qr?size=300&margin=1&dark=5A0F1B&light=FFFDF7&text=https%3A%2F%2Fwww.google.com%2Fmaps%2Fdir%2F%3Fapi%3D1%26destination%3DCalle%2Bdel%2BEncanto%252C%2BZoyatepec%252C%2BGuerrero%252C%2BMexico%26travelmode%3Ddriving%26dir_action%3Dnavigate" alt="Escanear para abrir ruta en Google Maps" class="qr-image">
        </a>
    </div>

</body>
</html>
